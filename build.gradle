plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.1'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'sporttagapp'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// https://mvnrepository.com/artifact/org.apache.xmlgraphics/fop
	implementation group: 'org.apache.xmlgraphics', name: 'fop', version: '2.9'
	implementation group: 'net.sf.saxon', name: 'Saxon-HE', version: '12.4'
	//implementation group: 'org.apache.pdfbox', name: 'pdfbox', version: '2.0.1'
	// https://mvnrepository.com/artifact/xalan/xalan
	//implementation group: 'xalan', name: 'xalan', version: '2.7.3'
	// https://mvnrepository.com/artifact/xalan/serializer
	//implementation group: 'xalan', name: 'serializer', version: '2.7.3'
}

tasks.named('test') {
	useJUnitPlatform()
}
